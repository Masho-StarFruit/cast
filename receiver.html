<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>キャスト受信</title></head>
<body style="font-family:sans-serif;text-align:center;padding:16px;margin:0;background:#000;color:#fff">
<div id="w"><p style="font-size:28px;font-weight:bold;margin:20px 0 0">接続を待っています...</p><p style="color:#ff6b6b;font-size:28px;font-weight:bold;margin:40px 0 0">今回のコード</p><p id="code" style="color:#ff6b6b;font-size:64px;font-weight:bold;letter-spacing:8px;margin:8px 0 0">-------</p><p id="er2" style="color:#ff6b6b;font-weight:bold;display:none"></p><p style="font-size:24px;font-weight:bold;margin:60px 0 0">タイムゾーン <span id="z0"></span> <span id="d0" style="margin-left:12px"></span> <span id="t0" style="margin-left:12px"></span></p><div style="margin-top:30px"><button id="mOne" style="font-size:18px;padding:10px 18px;border-radius:12px;border:none;background:#0af;color:#fff">1人で見る</button> <button id="mMulti" style="font-size:18px;padding:10px 18px;border-radius:12px;border:none;background:#333;color:#fff">複数人で見る</button></div><div id="multiBox" style="display:none;margin-top:20px"><input id="cd" inputmode="numeric" placeholder="7桁のコード" style="font-size:28px;padding:12px;width:85%;max-width:300px;text-align:center;letter-spacing:6px;border-radius:12px;border:none"><br><br><button id="goMulti" style="font-size:24px;padding:12px 32px;border-radius:12px;border:none;background:#0af;color:#fff">接続する</button><p id="er" style="color:#ff6b6b;font-weight:bold;display:none"></p></div></div>
<div id="cn" style="display:none"><p id="code2" style="color:#ff6b6b;font-size:64px;font-weight:bold;margin:20px 0 0">-------</p><p id="nm2" style="font-size:36px;font-weight:bold;margin:16px 0 0">---</p><div id="tt1" style="font-size:24px;font-weight:bold;margin-top:40px">タイムゾーン <span id="z1"></span> <span id="d1" style="margin-left:12px"></span> <span id="t1t" style="margin-left:12px"></span></div><div id="tt2" style="display:none;font-size:24px;font-weight:bold;margin-top:40px"><p style="margin:0">送信側 <span id="sz"></span> <span id="sd" style="margin-left:12px"></span> <span id="st2" style="margin-left:12px"></span></p><p style="margin:12px 0 0">受信側 <span id="z22"></span> <span id="d22" style="margin-left:12px"></span> <span id="t22" style="margin-left:12px"></span></p></div></div>
<div id="vw"></div>
<button id="play" style="display:none;font-size:24px;padding:14px 36px;margin-top:20px;border-radius:12px;border:none;background:#0af;color:#fff">▶ 映像を出す</button><br>
<button id="full" style="display:none;font-size:18px;padding:10px 20px;margin-top:12px;border-radius:12px;border:none">全画面にする</button>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
let code=String(Math.floor(1000000+Math.random()*9000000));document.getElementById('code').textContent=code;document.getElementById('code2').textContent='['+code+']';
let TZ=Intl.DateTimeFormat().resolvedOptions().timeZone,sTZ=null,conn2=null,myVideo=null,mode='one',peer2=null;
const CFG={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}]}};
function tm(){let nn=new Date(),d=nn.getFullYear()+'/'+String(nn.getMonth()+1).padStart(2,'0')+'/'+String(nn.getDate()).padStart(2,'0'),t=nn.toLocaleTimeString('ja-JP');for(let [id,v] of [['z0',TZ],['d0',d],['t0',t],['z1',TZ],['d1',d],['t1t',t],['z22',TZ],['d22',d],['t22',t]])document.getElementById(id).textContent=v;let dual=sTZ&&sTZ!==TZ;document.getElementById('tt1').style.display=dual?'none':'block';document.getElementById('tt2').style.display=dual?'block':'none';return{d,t}}
setInterval(()=>{let o=tm();if(conn2&&conn2.open)conn2.send({type:'receiverTime',timeZone:TZ,date:o.d,time:o.t})},1000);tm();
document.getElementById('play').onclick=()=>{if(myVideo){myVideo.muted=false;myVideo.play();document.getElementById('play').style.display='none'}};
document.getElementById('full').onclick=()=>{if(myVideo&&myVideo.requestFullscreen)myVideo.requestFullscreen()};
function err(m){let e=document.getElementById('er');e.textContent=m;e.style.display='block'}
function setMode(m){mode=m;document.getElementById('multiBox').style.display=m==='multi'?'block':'none';document.getElementById('mOne').style.background=m==='one'?'#0af':'#333';document.getElementById('mMulti').style.background=m==='multi'?'#0af':'#333';if(m==='one')startOneHost();else if(peer2)try{peer2.destroy()}catch(e){}}
document.getElementById('mOne').onclick=()=>setMode('one');document.getElementById('mMulti').onclick=()=>setMode('multi');
function onStream(s){if(myVideo)return;let v=document.createElement('video');myVideo=v;v.srcObject=s;v.autoplay=true;v.muted=true;v.playsInline=true;v.controls=true;v.style.width='100%';v.style.maxHeight='85vh';v.style.background='#000';v.style.borderRadius='12px';document.getElementById('vw').appendChild(v);v.play().catch(()=>{document.getElementById('play').style.display='inline-block'});v.onplaying=()=>{document.getElementById('play').style.display='none';document.getElementById('full').style.display='inline-block';if(conn2&&conn2.open)conn2.send({type:'videoShown'})}}
document.getElementById('goMulti').onclick=()=>{let c=document.getElementById('cd').value.trim();if(c.length!==7)return err('7桁のコードを入れてね');if(typeof Peer==='undefined'){let e=document.getElementById('er2');e.style.display='block';e.textContent='ネットに繋がっていません。';return}let p=new Peer(CFG);peer2=p;p.on('open',(myId)=>{conn2=p.connect('cast-'+c,{reliable:true});conn2.on('open',()=>{let nm=prompt('端末名を入れてね',localStorage.getItem('cast-sn')||'受信側')||'受信側';localStorage.setItem('cast-sn',nm);conn2.send({type:'hello',name:nm,peerId:myId});document.getElementById('w').style.display='none';document.getElementById('cn').style.display='block';document.getElementById('nm2').textContent=nm+'と接続中です。'});conn2.on('data',d=>{if(d.type==='time'){sTZ=d.timeZone;document.getElementById('sz').textContent=d.timeZone;document.getElementById('sd').textContent=d.date;document.getElementById('st2').textContent=d.time}});});p.on('call',call=>{call.answer();call.on('stream',onStream)});p.on('error',e=>{let el=document.getElementById('er2');el.style.display='block';el.textContent='接続エラー:'+e.type})};
function startOneHost(){if(typeof Peer==='undefined'){let e=document.getElementById('er2');e.style.display='block';e.textContent='ネットに繋がっていません。';return}if(peer2)try{peer2.destroy()}catch(e){}peer2=new Peer('cast-'+code,CFG);peer2.on('connection',c=>{conn2=c;c.on('data',d=>{if(d.type==='hello'){document.getElementById('w').style.display='none';document.getElementById('cn').style.display='block';document.getElementById('nm2').textContent=d.name+'と接続中です。'}if(d.type==='time'){sTZ=d.timeZone;document.getElementById('sz').textContent=d.timeZone;document.getElementById('sd').textContent=d.date;document.getElementById('st2').textContent=d.time}})});peer2.on('call',call=>{call.answer();call.on('stream',onStream)});peer2.on('error',e=>{let el=document.getElementById('er2');el.style.display='block';el.textContent='接続エラー:'+e.type})}
startOneHost();
window.addEventListener('beforeunload',()=>{if(conn2&&conn2.open)conn2.send({type:'bye'})});
</script></body></html>
