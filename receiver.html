<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>キャスト受信</title></head>
<body style="font-family:sans-serif;text-align:center;padding:16px;margin:0;background:#000;color:#fff">
<div id="w"><h2>端末名を決めてください</h2><input id="nm" placeholder="例:Bさん / Cさん" style="font-size:24px;padding:12px;width:85%;max-width:300px;text-align:center;border-radius:12px;border:none"><br><br><button id="sv" style="font-size:24px;padding:12px 32px;border-radius:12px;border:none;background:#0af;color:#fff">決定</button></div>
<div id="b2" style="display:none"><h2>見る側</h2><p id="lb"></p>
<div style="margin:12px 0"><button id="mMulti" style="font-size:18px;padding:10px 18px;border-radius:12px;border:none;background:#0af;color:#fff">複数人で見る</button> <button id="mOne" style="font-size:18px;padding:10px 18px;border-radius:12px;border:none;background:#333;color:#fff">1人で見る</button></div>
<div id="multiBox"><p>送信側（Aさん）が決めた7桁を入れてね</p><input id="cd" inputmode="numeric" placeholder="7桁のコード" style="font-size:28px;padding:12px;width:85%;max-width:300px;text-align:center;letter-spacing:6px;border-radius:12px;border:none"><br><br><button id="goMulti" style="font-size:24px;padding:12px 32px;border-radius:12px;border:none;background:#0af;color:#fff">見る</button></div>
<div id="oneBox" style="display:none"><p style="color:#ff6b6b;font-size:22px;font-weight:bold">このコードを送信側に教えてね</p><p id="code" style="color:#ff6b6b;font-size:64px;font-weight:bold;letter-spacing:8px;margin:8px 0">-------</p><p>送信側が接続するのを待ってます...</p></div>
<p id="er" style="color:#ff6b6b;font-weight:bold;display:none"></p></div>
<div id="cn" style="display:none"><p id="nm2" style="font-size:28px;font-weight:bold">接続中...</p><div id="tt1" style="font-size:22px;font-weight:bold">タイムゾーン <span id="z1"></span> <span id="d1" style="margin-left:12px"></span> <span id="t1t" style="margin-left:12px"></span></div><div id="tt2" style="display:none;font-size:22px;font-weight:bold"><p style="margin:0">送信側 <span id="sz"></span> <span id="sd" style="margin-left:12px"></span> <span id="st2" style="margin-left:12px"></span></p><p style="margin:12px 0 0">受信側 <span id="z22"></span> <span id="d22" style="margin-left:12px"></span> <span id="t22" style="margin-left:12px"></span></p></div></div>
<div id="vw"></div><button id="play" style="display:none;font-size:24px;padding:14px 36px;margin-top:20px;border-radius:12px;border:none;background:#0af;color:#fff">▶ 映像＋音を出す</button><br><button id="full" style="display:none;font-size:18px;padding:10px 20px;margin-top:12px;border-radius:12px;border:none">全画面にする</button>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
let n=localStorage.getItem('cast-sn'),peer,conn,myVideo=null,sTZ=null,myCode=String(Math.floor(1000000+Math.random()*9000000));
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone;
const CFG={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}]}};
function scr(){document.getElementById('w').style.display=n?'none':'block';document.getElementById('b2').style.display=n?'block':'none';if(n)document.getElementById('lb').textContent='端末名:'+n}scr();
document.getElementById('sv').onclick=()=>{let v=document.getElementById('nm').value.trim();if(!v)return alert('端末名を入れてね');localStorage.setItem('cast-sn',v);n=v;scr()};
function tm(){let now=new Date(),d=now.getFullYear()+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+String(now.getDate()).padStart(2,'0'),t=now.toLocaleTimeString('ja-JP');for(let [id,v] of [['z1',TZ],['d1',d],['t1t',t],['z22',TZ],['d22',d],['t22',t]])document.getElementById(id).textContent=v;let dual=sTZ&&sTZ!==TZ;document.getElementById('tt1').style.display=dual?'none':'block';document.getElementById('tt2').style.display=dual?'block':'none';return{d,t}}setInterval(()=>{let o=tm();if(conn&&conn.open)conn.send({type:'receiverTime',timeZone:TZ,date:o.d,time:o.t})},1000);tm();
function err(m){let e=document.getElementById('er');e.textContent=m;e.style.display='block'}
function setMode(m){document.getElementById('multiBox').style.display=m==='multi'?'block':'none';document.getElementById('oneBox').style.display=m==='one'?'block':'none';document.getElementById('mMulti').style.background=m==='multi'?'#0af':'#333';document.getElementById('mOne').style.background=m==='one'?'#0af':'#333';if(m==='one')startOneHost();}
document.getElementById('mMulti').onclick=()=>setMode('multi');document.getElementById('mOne').onclick=()=>setMode('one');
document.getElementById('play').onclick=()=>{if(myVideo){myVideo.muted=false;myVideo.play();document.getElementById('play').style.display='none'}};
document.getElementById('full').onclick=()=>{if(myVideo&&myVideo.requestFullscreen)myVideo.requestFullscreen()};
function onStream(s){if(myVideo)return;let v=document.createElement('video');myVideo=v;v.srcObject=s;v.autoplay=true;v.muted=true;v.playsInline=true;v.controls=true;v.style.width='100%';v.style.maxHeight='85vh';v.style.background='#000';v.style.borderRadius='12px';document.getElementById('vw').appendChild(v);v.play().catch(()=>{document.getElementById('play').style.display='inline-block'});v.onplaying=()=>{document.getElementById('play').style.display='none';document.getElementById('full').style.display='inline-block';if(conn&&conn.open)conn.send({type:'videoShown'})}}
document.getElementById('goMulti').onclick=()=>{let c=document.getElementById('cd').value.trim();if(c.length!==7)return err('7桁のコードを入れてね');if(typeof Peer==='undefined')return err('ネットに繋がっていません。');peer=new Peer(CFG);peer.on('open',(myId)=>{conn=peer.connect('cast-'+c,{reliable:true});conn.on('open',()=>{conn.send({type:'hello',name:n,peerId:myId});document.getElementById('b2').style.display='none';document.getElementById('cn').style.display='block';document.getElementById('nm2').textContent=n+'で接続中です。待ってね...'});conn.on('data',d=>{if(d.type==='time'){sTZ=d.timeZone;document.getElementById('sz').textContent=d.timeZone;document.getElementById('sd').textContent=d.date;document.getElementById('st2').textContent=d.time}});});peer.on('call',call=>{call.answer();call.on('stream',onStream)});peer.on('error',e=>err('接続エラー:'+e.type))};
function startOneHost(){document.getElementById('code').textContent=myCode;if(peer)try{peer.destroy()}catch(e){}peer=new Peer('cast-'+myCode,CFG);peer.on('connection',c=>{conn=c;c.on('data',d=>{if(d.type==='hello'){document.getElementById('b2').style.display='none';document.getElementById('cn').style.display='block';document.getElementById('nm2').textContent=d.name+'と接続中です。'}if(d.type==='time'){sTZ=d.timeZone;document.getElementById('sz').textContent=d.timeZone;document.getElementById('sd').textContent=d.date;document.getElementById('st2').textContent=d.time}})});peer.on('call',call=>{call.answer();call.on('stream',onStream)});peer.on('error',e=>err('接続エラー:'+e.type))}
window.addEventListener('beforeunload',()=>{if(conn&&conn.open)conn.send({type:'bye'})});
</script></body></html>
