<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>キャスト送信</title></head>
<body style="font-family:sans-serif;text-align:center;padding:20px 16px;margin:0;background:#111;color:#fff">
<div id="a"><h2>端末名を決めてください</h2><input id="nm" placeholder="例:Aさん / PC" style="font-size:24px;padding:12px;width:85%;max-width:300px;text-align:center;border-radius:12px;border:none"><br><br><button id="sv" style="font-size:24px;padding:12px 32px;border-radius:12px;border:none;background:#0af;color:#fff">決定</button></div>
<div id="b" style="display:none"><h2>送信側</h2><p id="lb" style="font-weight:bold"></p><button id="ch" style="padding:6px 16px;border-radius:8px">名前を変える</button><br><br>
<div style="margin:8px 0"><button id="mMulti" style="font-size:18px;padding:10px 18px;border-radius:12px;border:none;background:#0af;color:#fff">複数人に送る</button> <button id="mOne" style="font-size:18px;padding:10px 18px;border-radius:12px;border:none;background:#333;color:#fff">1人に送る</button></div>
<div id="multiBox"><p style="color:#ff6b6b;font-size:22px;font-weight:bold;margin:10px 0 0">このコードを受信側に教えてね</p><p id="code" style="color:#ff6b6b;font-size:64px;font-weight:bold;letter-spacing:8px;margin:8px 0">-------</p><p id="cnt" style="font-size:22px;font-weight:bold">見てる人：0人</p><p id="list" style="font-size:16px;opacity:.8"></p><button id="goMulti" style="font-size:24px;padding:12px 32px;border-radius:12px;border:none;background:#0af;color:#fff">画面＋音を送る</button></div>
<div id="oneBox" style="display:none"><p style="font-size:18px">受信側に表示された7桁を入れてね</p><input id="cd" inputmode="numeric" placeholder="7桁のコード" style="font-size:28px;padding:12px;width:85%;max-width:300px;text-align:center;letter-spacing:6px;border-radius:12px;border:none"><br><br><button id="goOne" style="font-size:24px;padding:12px 32px;border-radius:12px;border:none;background:#0af;color:#fff">画面＋音を送る</button></div>
<p id="er" style="color:#ff6b6b;font-weight:bold;display:none"></p><p id="st" style="font-size:13px;opacity:.7"></p>
<div id="c" style="display:none"><p style="font-size:28px;font-weight:bold;margin:0">送信中...</p><p id="wt" style="font-size:18px">受信側に映像が出るのを待っています...</p><p id="ok" style="display:none;font-size:30px;font-weight:bold;color:#4ade80">接続しました。</p><div style="font-size:22px;font-weight:bold;margin-top:12px"><p id="t1" style="margin:0">タイムゾーン <span id="z"></span> <span id="d"></span> <span id="t"></span></p><div id="t2" style="display:none"><p style="margin:0">送信側 <span id="z2"></span> <span id="d2"></span> <span id="t2t"></span></p><p style="margin:8px 0 0">受信側 <span id="rz">---</span> <span id="rd"></span> <span id="rt"></span></p></div></div><video id="v" autoplay muted playsinline style="width:100%;max-width:480px;margin-top:16px;background:#000;border-radius:12px"></video><br><br><button id="off" style="font-size:20px;padding:10px 24px;border-radius:12px;border:none;background:#ff4757;color:#fff">切断する</button></div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
let n=localStorage.getItem('cast-sn'),peer,stream,viewers=[],mode='multi',timer,rTZ=null,onePeer=null,oneConn=null;
let myCode=String(Math.floor(1000000+Math.random()*9000000));
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone;
const CFG={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}]}};
function scr(){document.getElementById('a').style.display=n?'none':'block';document.getElementById('b').style.display=n?'block':'none';if(n){document.getElementById('lb').textContent='端末名:'+n;startHost();}}scr();
document.getElementById('sv').onclick=()=>{let v=document.getElementById('nm').value.trim();if(!v)return alert('端末名を入れてね');localStorage.setItem('cast-sn',v);n=v;scr()};
document.getElementById('ch').onclick=()=>{localStorage.removeItem('cast-sn');n=null;scr()};
function tm(){let now=new Date(),d=now.getFullYear()+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+String(now.getDate()).padStart(2,'0'),t=now.toLocaleTimeString('ja-JP');document.getElementById('z').textContent=TZ;document.getElementById('d').textContent=d;document.getElementById('t').textContent=t;document.getElementById('z2').textContent=TZ;document.getElementById('d2').textContent=d;document.getElementById('t2t').textContent=t;let dual=rTZ&&rTZ!==TZ;document.getElementById('t1').style.display=dual?'none':'block';document.getElementById('t2').style.display=dual?'block':'none';return{d,t}}setInterval(tm,1000);tm();
function err(m){let e=document.getElementById('er');e.textContent=m;e.style.display='block'}
function setMode(m){mode=m;document.getElementById('multiBox').style.display=m==='multi'?'block':'none';document.getElementById('oneBox').style.display=m==='one'?'block':'none';document.getElementById('mMulti').style.background=m==='multi'?'#0af':'#333';document.getElementById('mOne').style.background=m==='one'?'#0af':'#333';if(m==='multi')startHost();}
document.getElementById('mMulti').onclick=()=>setMode('multi');document.getElementById('mOne').onclick=()=>setMode('one');
function startHost(){if(peer)try{peer.destroy()}catch(e){}document.getElementById('code').textContent=myCode;peer=new Peer('cast-'+myCode,CFG);peer.on('open',()=>{document.getElementById('st').textContent='待機中... 複数人用コード:'+myCode});peer.on('connection',c=>{c.on('data',d=>{if(d.type==='hello'){let ex=viewers.find(v=>v.peer===c.peer);if(!ex)viewers.push({peer:c.peer,name:d.name,conn:c});document.getElementById('cnt').textContent='見てる人：'+viewers.length+'人';document.getElementById('list').textContent=viewers.map(v=>v.name).join(' / ');if(stream){try{peer.call(c.peer,stream)}catch(e){}}}if(d.type==='receiverTime'){rTZ=d.timeZone;document.getElementById('rz').textContent=rTZ;document.getElementById('rd').textContent=d.date;document.getElementById('rt').textContent=d.time}if(d.type==='videoShown'){document.getElementById('wt').style.display='none';document.getElementById('ok').style.display='block'}if(d.type==='bye'){viewers=viewers.filter(v=>v.peer!==c.peer);document.getElementById('cnt').textContent='見てる人：'+viewers.length+'人';}});c.on('close',()=>{viewers=viewers.filter(v=>v.peer!==c.peer);document.getElementById('cnt').textContent='見てる人：'+viewers.length+'人';})});peer.on('error',e=>err('接続エラー:'+e.type))}
async function getStream(){try{return await navigator.mediaDevices.getDisplayMedia({video:true,audio:true})}catch(e){err('画面共有をキャンセルしました。');return null}}
function showSending(){document.getElementById('c').style.display='block';document.getElementById('goMulti').style.display='none';document.getElementById('goOne').style.display='none';if(timer)clearInterval(timer);timer=setInterval(()=>{let o=tm();viewers.forEach(v=>{if(v.conn&&v.conn.open)v.conn.send({type:'time',name:n,timeZone:TZ,date:o.d,time:o.t})});if(oneConn&&oneConn.open)oneConn.send({type:'time',name:n,timeZone:TZ,date:o.d,time:o.t})},1000)}
document.getElementById('goMulti').onclick=async()=>{stream=await getStream();if(!stream)return;document.getElementById('v').srcObject=stream;showSending();viewers.forEach(v=>{try{peer.call(v.peer,stream)}catch(e){}})};
document.getElementById('goOne').onclick=async()=>{let c=document.getElementById('cd').value.trim();if(c.length!==7)return err('7桁のコードを入れてね');stream=await getStream();if(!stream)return;document.getElementById('v').srcObject=stream;showSending();onePeer=new Peer(CFG);onePeer.on('open',()=>{oneConn=onePeer.connect('cast-'+c,{reliable:true});oneConn.on('open',()=>{oneConn.send({type:'hello',name:n})});let iv=setInterval(()=>{if(document.getElementById('ok').style.display==='block'){clearInterval(iv);return}try{onePeer.call('cast-'+c,stream)}catch(e){}},2000);oneConn.on('data',d=>{if(d.type==='receiverTime'){rTZ=d.timeZone;document.getElementById('rz').textContent=rTZ;document.getElementById('rd').textContent=d.date;document.getElementById('rt').textContent=d.time}if(d.type==='videoShown'){document.getElementById('wt').style.display='none';document.getElementById('ok').style.display='block'}});});onePeer.on('error',e=>err('接続エラー:'+e.type))};
document.getElementById('off').onclick=()=>{if(timer)clearInterval(timer);if(stream)stream.getTracks().forEach(x=>x.stop());if(peer)peer.destroy();if(onePeer)onePeer.destroy();location.reload()};
</script></body></html>
